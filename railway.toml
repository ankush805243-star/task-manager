[build]
builder = "NIXPACKS"
installCommand = "npm install --legacy-peer-deps && cd server && npm install --legacy-peer-deps && cd ../client && npm install --legacy-peer-deps"
buildCommand = "cd client && npm run build"

[deploy]
startCommand = "cd server && npx prisma migrate deploy && node src/index.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

